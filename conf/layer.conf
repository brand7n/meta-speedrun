# meta-quilter - Custom layer for Project Speedrun (i.MX8M Mini)
BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-quilter"
BBFILE_PATTERN_meta-quilter = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-quilter = "99"

# Layer dependencies
# - core: Base Yocto/OE layer
# - freescale-layer: NXP/Freescale BSP support
# - fsl-bsp-release: i.MX specific BSP (U-Boot, kernel) from meta-imx
LAYERDEPENDS_meta-quilter = "core freescale-layer fsl-bsp-release"

LAYERSERIES_COMPAT_meta-quilter = "walnascar scarthgap"

# Qt5: code.qt.io git:// protocol (port 9418) is commonly blocked; use https
QT_GIT_PROTOCOL = "https"
