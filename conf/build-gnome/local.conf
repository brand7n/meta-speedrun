MACHINE ??= 'imx8mmevk'
DISTRO ?= 'fsl-imx-xwayland'
EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
CONF_VERSION = "2"

DL_DIR ?= "${BSPDIR}/downloads/"

# Accept NXP EULA
ACCEPT_FSL_EULA = "1"

# Accept commercial licenses (ffmpeg codecs needed by mpv)
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# GNOME requires these distro features
# NXP removes pulseaudio, we need to add it back using _BACKFILL_CONSIDERED
DISTRO_FEATURES:append = " polkit systemd gobject-introspection-data pulseaudio"
DISTRO_FEATURES_BACKFILL_CONSIDERED:remove = "pulseaudio"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Enable V4L2 M2M hardware codec support in ffmpeg (Hantro VPU)
PACKAGECONFIG:append:pn-ffmpeg = " v4l2 gpl"
EXTRA_OECONF:append:pn-ffmpeg = " --enable-v4l2-m2m"

# Switch to Debian packaging
PACKAGE_CLASSES = "package_deb"

# Auto-clean work directories after each recipe completes to save disk space
INHERIT += "rm_work"
RM_WORK_EXCLUDE += "linux-imx mutter gnome-shell chromium-ozone-wayland imx-image-multimedia"

# Mask out gstreamer1.0-rtsp-server - freedesktop.org fetch/configure failures
BBMASK += "recipes-multimedia/gstreamer/gstreamer1.0-rtsp-server"

# Timezone — Pacific Time (must be global, not in image bbappend — tzdata reads this)
DEFAULT_TIMEZONE = "America/Los_Angeles"
