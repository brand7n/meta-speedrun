# Kernel command line for Plymouth boot splash
# Extends (not replaces) U-Boot bootargs
# Must explicitly disable CMDLINE_FROM_BOOTLOADER — choice options
# conflict in merge_config.sh if both are set.
# CONFIG_CMDLINE_FROM_BOOTLOADER is not set
CONFIG_CMDLINE_EXTEND=y
CONFIG_CMDLINE="root=/dev/mmcblk1p2 rootwait rw loglevel=0 quiet splash plymouth.ignore-serial-consoles plymouth.persist-splash vt.global_cursor_default=0"

# Suppress kernel messages on console for clean Plymouth splash.
# CONSOLE_LOGLEVEL_DEFAULT: compile-time default before cmdline is parsed.
# CONSOLE_LOGLEVEL_QUIET: what "quiet" on cmdline sets the loglevel to.
# Both must be 1 — otherwise "quiet" overrides loglevel=0 back to 4.
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=1
CONFIG_CONSOLE_LOGLEVEL_QUIET=1
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=4

# Deferred fbcon takeover: prevents the framebuffer console from clearing
# the screen at boot. The screen stays as-is (U-Boot splash or black)
# until Plymouth or another userspace process writes to the display.
# Without this, fbcon immediately blanks the screen when the kernel starts,
# causing a visible black gap before Plymouth can attach to DRM.
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y
